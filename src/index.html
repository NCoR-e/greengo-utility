<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="author" content="NCoRe">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" sizes="512x512 256x256 128x128 64x64 32x32" href="/tab.ico">
  <script type="module" src="/scripts/index.js"></script>
  <title>Greengo Utility</title>
</head>

<body>
  <main>
    <section class="branch">
      <header class="header">
        <h1 class="header__title">Greengo Utility</h1>
        <h2 class="header__sub-title">Выберите узел, чтобы открыть 3x-ui панель</h2>
      </header>

      <div class="branch__card-list">
        <article class="branch__card card card--main" tabindex="0">
          <div class="card__header">
            <div class="card__title">
              <h3 class="card__country-code"><b>CH</b> Швейцария</h3>
            </div>

            <svg class="card__icon" aria-hidden="true">
              <use href="/sprites.svg#flag-ch"></use>
            </svg>
          </div>

          <div class="card__body">
            <div class="card__meta">
              <span class="card__meta-item"><b>Хост:</b> ###.###.###.###</span>
              <span class="card__meta-item"><b>Порт:</b> #####</span>
            </div>

            <a class="card__open-btn" href="#" target="_blank">Открыть панель</a>
          </div>

          <footer class="card__footer">
            <details class="card__setting setting">
              <summary class="setting__header" aria-label="Меню редактирования карточки">
                <svg class="setting__icon setting__icon--menu" aria-hidden="true">
                  <use href="/sprites.svg#menu-ico"></use>
                </svg>

                <svg class="setting__icon setting__icon--close" aria-hidden="true">
                  <use href="/sprites.svg#close-ico"></use>
                </svg>
              </summary>

              <ul class="setting__list" aria-label="Список кнопок для редактирования">
                <li><button type="button">Изменить автоматически</button></li>
                <li><button type="button">Изменить вручную</button></li>
                <li><button type="button">Изменить флаг</button></li>
              </ul>
            </details>
          </footer>
        </article>

        <article class="branch__card card card--main" tabindex="0">
          <div class="card__header">
            <div class="card__title">
              <h3 class="card__country-code"><b>SE</b> Швеция</h3>
            </div>

            <svg class="card__icon" aria-hidden="true">
              <use href="/sprites.svg#flag-se"></use>
            </svg>
          </div>

          <div class="card__body">
            <div class="card__meta">
              <span class="card__meta-item"><b>Хост:</b> ###.###.###.###</span>
              <span class="card__meta-item"><b>Порт:</b> #####</span>
            </div>

            <a class="card__open-btn" href="#" target="_blank">Открыть панель</a>
          </div>

          <footer class="card__footer">
            <details class="card__setting setting">
              <summary class="setting__header" aria-label="Меню редактирования карточки">
               <svg class="setting__icon setting__icon--menu" aria-hidden="true">
                  <use href="/sprites.svg#menu-ico"></use>
                </svg>

                <svg class="setting__icon setting__icon--close" aria-hidden="true">
                  <use href="/sprites.svg#close-ico"></use>
                </svg>
              </summary>

              <ul class="setting__list">
                <li><button type="button">Изменить автоматически</button></li>
                <li><button type="button">Изменить вручную</button></li>
                <li><button type="button">Изменить флаг</button></li>
              </ul>
            </details>
          </footer>
        </article>

        <article class="branch__card card card--main" tabindex="0">
          <div class="card__header">
            <div class="card__title">
              <h3 class="card__country-code"><b>US</b> США</h3>
            </div>

            <svg class="card__icon" aria-hidden="true">
              <use href="/sprites.svg#flag-us"></use>
            </svg>
          </div>

          <div class="card__body">
            <div class="card__meta">
              <span class="card__meta-item"><b>Хост:</b> ###.###.###.###</span>
              <span class="card__meta-item"><b>Порт:</b> #####</span>
            </div>

            <a class="card__open-btn" href="#" target="_blank">Открыть панель</a>
          </div>

          <footer class="card__footer">
            <details class="card__setting setting" aria-label="Меню редактирования карточки">
              <summary class="setting__header">
                <svg class="setting__icon setting__icon--menu" aria-hidden="true">
                  <use href="/sprites.svg#menu-ico"></use>
                </svg>

                <svg class="setting__icon setting__icon--close" aria-hidden="true">
                  <use href="/sprites.svg#close-ico"></use>
                </svg>
              </summary>

              <ul class="setting__list">
                <li><button type="button">Изменить автоматически</button></li>
                <li><button type="button">Изменить вручную</button></li>
                <li><button type="button">Изменить флаг</button></li>
              </ul>
            </details>
          </footer>
        </article>

        <article class="branch__card card card--test" tabindex="0">
          <div class="card__header">
            <div class="card__title">
              <h3 class="card__country-code"><b>CH</b> Тестовая Швейцария</h3>
              <div class="card__description">
                <svg class="card__icon" aria-hidden="true">
                  <use href="/sprites.svg#flag-ch"></use>
                </svg>
              </div>
            </div>
          </div>

          <div class="card__body">
            <a class="card__open-btn" href="#" target="_blank">Открыть панель</a>
          </div>

          <footer class="card__footer">
            <details class="card__setting setting" aria-label="Меню редактирования карточки">
              <summary class="setting__header">
                <svg class="setting__icon setting__icon--menu" aria-hidden="true">
                  <use href="/sprites.svg#menu-ico"></use>
                </svg>

                <svg class="setting__icon setting__icon--close" aria-hidden="true">
                  <use href="/sprites.svg#close-ico"></use>
                </svg>
              </summary>

              <ul class="setting__list">
                <li><button type="button">Изменить заголовок</button></li>
                <li><button type="button">Изменить флаг</button></li>
              </ul>
            </details>
          </footer>
        </article>
      </div>
    </section>
  </main>
</body>

</html>
